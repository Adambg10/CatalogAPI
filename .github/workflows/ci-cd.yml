
name: CI/CD Pipeline - ProductCatalog API

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # JOB 1: Continuous Integration (Build & Unit Tests)
  unit-tests:
    name: Build & Unit Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Configure .NET SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # 3. Restore dependencies
      - name: Restore dependencies
        run: dotnet restore src/ProductCatalog.Api/ProductCatalog.Api.csproj

      # 4. Build project
      - name: Build solution
        run: dotnet build src/ProductCatalog.Api/ProductCatalog.Api.csproj --configuration Release --no-restore

      # 5. Run Unit Tests
      - name: Run Unit Tests
        run: >
          dotnet test tests/ProductCatalog.Tests/ProductCatalog.Tests.csproj
          --filter "FullyQualifiedName~ProductUnitTests"
          --configuration Release
